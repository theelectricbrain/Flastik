[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flastik"
dynamic = ["version"]
description = "A Flask-like Tiny-framework for static websites"
readme = "README.md"
authors = [
    { name = "Dr. Thomas Roc", email = "info@electricbrain.fr" }
]
requires-python = ">=3.10"
# Note: docutils >= 0.22 is required for publish_parts(writer="html5");
#       earlier releases only accept the deprecated 'writer_name' argument.
dependencies = ["jinja2", "docutils>=0.22"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["reportlab"]

[project.scripts]
flastik = "flastik.cli:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "TRY", "EXE"]
ignore = [
    "TRY003",
    "TRY400",
]

[tool.coverage.run]
source = ["flastik"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.setuptools.dynamic]
version = { attr = "flastik.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["flastik"]

[tool.setuptools.package-data]
flastik = [
    "README.pdf",
    "LICENSE.txt",
    "base_templates/*",
    "doc_templates/*",
    "bootstrap/BOOTSTRAP_LICENSE",
    "bootstrap/css/*",
    "bootstrap/js/*",
]
