[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flastik"
dynamic = ["version"]
description = "A Flask-like Tiny-framework for static websites"
readme = "README.md"
authors = [
    { name = "Dr. Thomas Roc", email = "info@electricbrain.fr" }
]
requires-python = ">=3.10"
# Note: docutils >= 0.22 is required for publish_parts(writer="html5");
#       earlier releases only accept the deprecated 'writer_name' argument.
dependencies = ["jinja2", "docutils>=0.22"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["reportlab"]

[project.scripts]
flastik = "flastik.cli:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: without it, "does ruff pass" depends on whichever ruff
# version happens to be installed, so CI and developer machines disagree.
# Note: pycodestyle is limited to its E4/E7/E9 subset, and W is left out on
#       purpose. test_flastik.py compares rendered pages against golden HTML
#       whose trailing whitespace is significant (see commit f527d4d), and
#       line length rules would fight those same long literals.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "TRY", "EXE"]
ignore = [
    # Flastik's error messages are contextual (which route, which file, which
    # variable), so they belong at the raise site rather than baked into an
    # exception class.
    "TRY003",
    # Several handlers log conditions they anticipate -- SameFileError when a
    # static file is already in place, for instance. The message is the
    # signal there; a full traceback would only be noise.
    "TRY400",
]

[tool.setuptools.dynamic]
version = { attr = "flastik.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["flastik"]

[tool.setuptools.package-data]
flastik = [
    "README.pdf",
    "LICENSE.txt",
    "base_templates/*",
    "doc_templates/*",
    "bootstrap/BOOTSTRAP_LICENSE",
    "bootstrap/css/*",
    "bootstrap/js/*",
]
