name: Ruff Lint and Format

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff==0.16.0
      - name: Ruff Check
        run: ruff check --output-format=github .
      - name: Ruff Format
        run: ruff format --check .
