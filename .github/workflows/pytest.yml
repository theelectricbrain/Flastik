name: Run Unit Test via Pytest

# Note: pull_request is what covers contributions from forks, which a push
#       trigger never sees. push is narrowed to master so that a pull request
#       from a branch in this repo is not built twice over.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          pip install ".[test]"
      - name: Test with pytest
        run: |
          coverage run -m pytest -v -s
      # Note: the report is written out before the threshold is checked, so a
      #       build that fails the floor still shows which lines are uncovered.
      #       --fail-under=0 overrides the configured floor for these steps
      #       only; the gate below is what actually enforces it.
      - name: Publish Coverage Report
        if: always()
        run: |
          coverage report --fail-under=0
          coverage xml --fail-under=0
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo
            coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      # Note: the floor lives in pyproject.toml ([tool.coverage.report]
      #       fail_under) so that a local `coverage report` enforces the same
      #       number CI does.
      - name: Enforce Coverage Floor
        run: |
          coverage report
